name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aistudio-signer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      go: ${{ steps.versions.outputs.go }}
      zig: ${{ steps.versions.outputs.zig }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Bootstrap the standard-library-only tool with the module's minimum Go.
      # Target jobs use the CI versions selected in dependencies.json.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check build inputs and read toolchain versions
        id: versions
        run: go run ./release check --github-output "$GITHUB_OUTPUT"
      - name: Vet release tool
        if: github.event_name == 'pull_request'
        env:
          CGO_ENABLED: '0'
        run: go vet ./release
      - name: Compile publication tool
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly -trimpath -buildvcs=false -o bin/release-tool ./release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tool
          path: bin/release-tool
          if-no-files-found: error
          retention-days: 14

  build:
    needs: check
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ needs.check.outputs.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            release/dependencies.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .release-cache/downloads
          key: native-archives-v1-${{ matrix.target }}-${{ hashFiles('release/dependencies.json') }}
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        if: startsWith(matrix.target, 'linux-')
        with:
          version: ${{ needs.check.outputs.zig }}
          use-cache: true
      - name: Test native engine (no account)
        run: go run ./release test-engine --target ${{ matrix.target }}
      - name: Build, check startup and package
        run: go run ./release release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aistudio-signer-${{ matrix.target }}
          path: |
            dist/aistudio-signer-*.zip
            dist/aistudio-signer-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assemble:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ needs.check.outputs.go }}
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: aistudio-signer-*
          path: dist
          merge-multiple: true
      - name: Assemble platform artifacts and checksums
        run: go run ./release assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [check, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # No compiler or account runtime runs in the write-privileged job.
      # Use the same Go tool compiled by this run's read-only check job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tool
          path: tooling
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: publish
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod 0755 tooling/release-tool
          tooling/release-tool publish --directory publish
